name: Go Quality Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        check-latest: true
        cache: true

    - name: Vet
      run: go vet ./...

    - name: Run Tests
      run: go test -v ./...

  test-simd:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: simd
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        check-latest: true
        cache: true

    - name: Vet
      run: go vet ./...

    - name: Run Tests
      run: go test -v ./...
